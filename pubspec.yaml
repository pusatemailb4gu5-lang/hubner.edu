name: hubner
description: Hubner - Aplikasi task, plan, note, dan anggota.
publish_to: 'none'

version: 1.1.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_localizations:
    sdk: flutter

  google_fonts: ^6.2.1
  intl: ^0.20.2

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.2
  firebase_data_connect: ^0.1.5+4
  shared_preferences: ^2.5.5
  http: ^1.2.2
  google_sign_in: ^7.2.0
  googleapis: ^16.0.0
  googleapis_auth: ^1.6.0
  file_picker: ^11.0.2
  url_launcher: ^6.3.2
  mime: ^2.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  flutter_svg: ^2.3.0
  audioplayers: ^6.7.1
  font_awesome_flutter: ^11.0.0
  image: ^4.3.0
  image_picker: ^1.1.2
  syncfusion_flutter_pdfviewer: ^33.2.13
  flutter_local_notifications: ^18.0.1
  shorebird_code_push: ^2.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/iconapp/iconapp.png"
  min_sdk_android: 21
  adaptive_icon_background: "#5E17EB"
  adaptive_icon_foreground: "assets/iconapp/adaptive_foreground.png"
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/landing/
    - assets/icon_pack/avatar/
    - assets/icon_pack/project/
    - assets/icon_pack/chat/
    - assets/iconapp/
    - assets/sounds/
    - shorebird.yaml
