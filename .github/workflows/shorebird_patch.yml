name: Deploy Shorebird Patch (Auto Update OTA)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  patch:
    name: Build & Deploy Shorebird Patch
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Shorebird
        uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Deploy Patch for Android
        run: shorebird patch android --allow-asset-diffs
        env:
          SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}
